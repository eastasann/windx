# ラベル定義。main への push で scripts/sync_labels.py が GitHub に同期する。
# 運用規約: docs/process/05-issues-roadmap.md
#
# 形式（この部分集合のみ対応）:
#   - name: "<ラベル名>"
#     color: "RRGGBB"
#     description: "<説明>"

# ── type/* : 何であるか（必須・1 つ） ──────────────────────────────
- name: "type/design-doc"
  color: "1D76DB"
  description: "設計文書（DD）の起案と追跡"
- name: "type/feature"
  color: "1D76DB"
  description: "新機能・機能改善"
- name: "type/bug"
  color: "D73A4A"
  description: "期待と異なる挙動"
- name: "type/task"
  color: "1D76DB"
  description: "DD から分解された実装単位、または設計判断のない作業"
- name: "type/spike"
  color: "1D76DB"
  description: "時間を区切った調査。成果物は必ず文書"
- name: "type/chore"
  color: "C5DEF5"
  description: "依存更新、整理など"
- name: "type/process"
  color: "5319E7"
  description: "開発プロセス自体の変更（ADR 必須）"

# ── priority/* : いつやるか（必須・1 つ） ──────────────────────────
- name: "priority/p0"
  color: "B60205"
  description: "本番障害・データ損失・セキュリティ。他を止めて今すぐ"
- name: "priority/p1"
  color: "D93F0B"
  description: "現マイルストーンで必ずやる"
- name: "priority/p2"
  color: "FBCA04"
  description: "やる。時期は未定"
- name: "priority/p3"
  color: "C5DEF5"
  description: "あればうれしい"

# ── stage/* : どのゲートにいるか ───────────────────────────────────
- name: "stage/g0-problem"
  color: "BFD4F2"
  description: "G0 問題定義。解くべきかを判断中"
- name: "stage/g1-design"
  color: "8FB8ED"
  description: "G1 設計合意。design doc をレビュー中"
- name: "stage/g2-build"
  color: "5B9BD5"
  description: "G2 実装承認。実装とレビュー中"
- name: "stage/g3-release"
  color: "2E75B6"
  description: "G3 出荷判断。リリース待ち"

# ── agent/* : AI の自律可否（本プロセスの要） ──────────────────────
- name: "agent/ready"
  color: "0E8A16"
  description: "AI が自律着手してよい。DoR を満たしたときだけ人間が付ける"
- name: "agent/wip"
  color: "FEF2C0"
  description: "AI が作業中。二重着手を防ぐ"
- name: "agent/needs-human"
  color: "E99695"
  description: "人間の判断・作業が必要。AI は着手しない"
- name: "agent/blocked"
  color: "6A737D"
  description: "外部要因で停止中。理由をコメントに書くこと"

# ── risk/* : 慎重さの度合い ────────────────────────────────────────
- name: "risk/high"
  color: "B60205"
  description: "セキュリティ・課金・データ移行・不可逆操作。レビュア 2 名必須、AI 単独承認不可"
- name: "risk/medium"
  color: "D93F0B"
  description: "挙動が変わる。ロールバック手順が必要"
- name: "risk/low"
  color: "C2E0C6"
  description: "影響が局所的"

# ── size/* : 見積もり（任意） ──────────────────────────────────────
- name: "size/xs"
  color: "EEEEEE"
  description: "2 時間未満"
- name: "size/s"
  color: "DDDDDD"
  description: "半日未満"
- name: "size/m"
  color: "CCCCCC"
  description: "2 日未満"
- name: "size/l"
  color: "BBBBBB"
  description: "1 週間未満"
- name: "size/xl"
  color: "999999"
  description: "要分割。分割するまで agent/ready を付けてはならない"

# ── area/* : どこの話か（プロダクト構造が決まったら追加する） ──────
- name: "area/docs"
  color: "006B75"
  description: "ドキュメント・プロセス文書"
- name: "area/ci"
  color: "006B75"
  description: "CI・自動化・開発基盤"

# ── その他 ─────────────────────────────────────────────────────────
- name: "good-first-issue"
  color: "7057FF"
  description: "受け入れ条件と影響範囲が明確で、着手しやすい"
- name: "duplicate"
  color: "CFD3D7"
  description: "重複。リンクしてクローズする"
- name: "skip-traceability"
  color: "CFD3D7"
  description: "PR のトレーサビリティ検証を免除する（Issue に紐づかない例外的な PR のみ）"
- name: "wontfix"
  color: "6A737D"
  description: "やらないと決めた。理由をコメントに残すこと"
