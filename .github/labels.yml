# Label definitions. scripts/sync_labels.py syncs these to GitHub on push to main.
# Conventions: docs/process/05-issues-roadmap.md
#
# Format (only this subset is supported):
#   - name: "<label name>"
#     color: "RRGGBB"
#     description: "<what it means>"

# -- type/* : what it is (required, exactly one) -----------------------------
- name: "type/design-doc"
  color: "1D76DB"
  description: "Proposing and tracking a design doc"
- name: "type/feature"
  color: "1D76DB"
  description: "New functionality or an improvement"
- name: "type/bug"
  color: "D73A4A"
  description: "Behaviour that differs from what is expected"
- name: "type/task"
  color: "1D76DB"
  description: "A unit decomposed from a design doc, or work with no design judgment"
- name: "type/spike"
  color: "1D76DB"
  description: "Time-boxed research; the output is always a document"
- name: "type/chore"
  color: "C5DEF5"
  description: "Dependency updates, tidying, and similar"
- name: "type/process"
  color: "5319E7"
  description: "A change to the development process itself (an ADR is mandatory)"

# -- priority/* : when (required, exactly one) -------------------------------
- name: "priority/p0"
  color: "B60205"
  description: "Production outage, data loss, security. Stop other work"
- name: "priority/p1"
  color: "D93F0B"
  description: "Must land in the current milestone"
- name: "priority/p2"
  color: "FBCA04"
  description: "Will happen; timing undecided"
- name: "priority/p3"
  color: "C5DEF5"
  description: "Nice to have"

# -- stage/* : which gate it is at -------------------------------------------
- name: "stage/g0-problem"
  color: "BFD4F2"
  description: "G0 framing: deciding whether it is worth solving"
- name: "stage/g1-design"
  color: "8FB8ED"
  description: "G1 design agreement: the design doc is under review"
- name: "stage/g2-build"
  color: "5B9BD5"
  description: "G2 implementation: building and reviewing"
- name: "stage/g3-release"
  color: "2E75B6"
  description: "G3 ship decision: awaiting release"

# -- agent/* : AI autonomy (the heart of this process) -----------------------
- name: "agent/ready"
  color: "0E8A16"
  description: "AI may start autonomously. Applied by a human only when the DoR is met"
- name: "agent/wip"
  color: "FEF2C0"
  description: "AI is working on it; prevents double-starting"
- name: "agent/needs-human"
  color: "E99695"
  description: "Needs a human decision or action; AI does not start"
- name: "agent/blocked"
  color: "6A737D"
  description: "Stopped by something external; say why in a comment"

# -- risk/* : how careful to be ---------------------------------------------
- name: "risk/high"
  color: "B60205"
  description: "Security, billing, data migration, irreversible operations. Two reviewers; AI may not approve alone"
- name: "risk/medium"
  color: "D93F0B"
  description: "Behaviour changes; a rollback path is required"
- name: "risk/low"
  color: "C2E0C6"
  description: "Locally contained impact"

# -- size/* : estimate (optional) -------------------------------------------
- name: "size/xs"
  color: "EEEEEE"
  description: "Under 2 hours"
- name: "size/s"
  color: "DDDDDD"
  description: "Under half a day"
- name: "size/m"
  color: "CCCCCC"
  description: "Under 2 days"
- name: "size/l"
  color: "BBBBBB"
  description: "Under a week"
- name: "size/xl"
  color: "999999"
  description: "Must be split; may not carry agent/ready until it is"

# -- area/* : which part of the product (extend once structure settles) ------
- name: "area/docs"
  color: "006B75"
  description: "Documentation and process documents"
- name: "area/ci"
  color: "006B75"
  description: "CI, automation, developer infrastructure"

# -- misc -------------------------------------------------------------------
- name: "good-first-issue"
  color: "7057FF"
  description: "Clear acceptance criteria and scope; easy to pick up"
- name: "duplicate"
  color: "CFD3D7"
  description: "Duplicate; link it and close"
- name: "skip-traceability"
  color: "CFD3D7"
  description: "Exempts the PR from traceability checks (only for PRs with no Issue)"
- name: "wontfix"
  color: "6A737D"
  description: "Decided against; leave the reason in a comment"
