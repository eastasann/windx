name: "Feature"
description: "New functionality or an improvement"
title: "[Feat] "
labels: ["type/feature", "stage/g0-problem"]
body:
  - type: markdown
    attributes:
      value: |
        If this is large enough to need design agreement, use the **Design Doc** template instead.
        The test: [`CLAUDE.md`](https://github.com/eastasann/windx/blob/main/CLAUDE.md)

  - type: textarea
    id: problem
    attributes:
      label: The problem to solve
      description: "Describe **the problem, not the solution**. Who, in what situation, is struggling with what?"
      placeholder: |
        (bad)  I want to add filters to search
        (good) Search returns 200 results, so users scroll four times on average before
               finding what they came for
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What changes if this is solved
      description: Describe the success state observably.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: |
        Given / When / Then plus **the command that proves it**. A criterion you cannot verify is not a criterion.
      value: |
        - **AC-1**: Given <precondition>, When <action>, Then <expected result>
          - Verify: `<command>`
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Non-Goals
      description: This acts as the agent's scope boundary. Do not leave it empty.
    validations:
      required: true

  - type: input
    id: design-doc
    attributes:
      label: Design doc
      description: The related DD, if any (e.g. `DD-0004`). Leave blank if none.
      placeholder: "DD-0004"
    validations:
      required: false
