name: "Spike"
description: "Time-boxed research. The output is always a document"
title: "[Spike] "
labels: ["type/spike", "stage/g1-design"]
body:
  - type: markdown
    attributes:
      value: |
        A spike is **research, not implementation**. Box the time and leave the output as a document.
        If the research shows implementation is needed, open a separate Issue.

  - type: textarea
    id: question
    attributes:
      label: The question to answer
      description: "State **the question a decision needs**, as 'determine whether X', not 'look into X'."
      placeholder: |
        (bad)  Look into Redis
        (good) Determine whether the existing Redis cluster can absorb the expected peak of
               1,200 req/s of session writes
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Which decision this answer feeds
      description: Name the Decision Point if there is one, as `DD-xxxx DP-n`.
    validations:
      required: true

  - type: dropdown
    id: timebox
    attributes:
      label: Time box
      description: Past this, stop and report whatever you have.
      options: ["2 hours", "half a day", "1 day", "2 days"]
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: Where what gets written down. **A verbal report is not a deliverable.**
      value: |
        - [ ] Findings as a comment on this Issue
        - [ ] Measurements appended to the related DD's Appendix
    validations:
      required: true
