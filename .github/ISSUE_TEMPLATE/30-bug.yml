name: "Bug（不具合）"
description: "期待と異なる挙動の報告"
title: "[Bug] "
labels: ["type/bug", "stage/g0-problem"]
body:
  - type: markdown
    attributes:
      value: |
        **再現しない不具合には着手しません。** 再現手順を可能な限り具体的に書いてください。
        修正は「先に失敗するテストを書いて再現させ、その後に直す」順序で行います。

  - type: textarea
    id: repro
    attributes:
      label: 再現手順
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する挙動
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の挙動
      description: エラーメッセージ・ログ・スタックトレースがあれば貼ってください（**秘密情報は伏せること**）。
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 影響度
      options:
        - "P0: 本番障害・データ損失・セキュリティ（今すぐ）"
        - "P1: 主要機能が使えない（現マイルストーン）"
        - "P2: 回避策がある"
        - "P3: 軽微"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 発生環境
      placeholder: "本番 / ステージング / ローカル、バージョン、ブラウザ等"
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: 影響範囲（分かれば）
      description: 疑わしいファイル・モジュール。調査は AI が行うので、推測で構いません。
    validations:
      required: false
