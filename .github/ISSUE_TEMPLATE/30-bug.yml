name: "Bug"
description: "Behaviour that differs from what is expected"
title: "[Bug] "
labels: ["type/bug", "stage/g0-problem"]
body:
  - type: markdown
    attributes:
      value: |
        **A bug that does not reproduce does not get worked on.** Be as specific as you can.
        Fixes follow the order: write a failing test that reproduces it, then fix it.

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the error, logs, or stack trace if you have them (**redact any secrets**).
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "P0: production outage, data loss, security (now)"
        - "P1: a core feature is unusable (current milestone)"
        - "P2: a workaround exists"
        - "P3: minor"
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Where it happened
      placeholder: "production / staging / local, version, browser, …"
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Suspected surface (if known)
      description: Files or modules you suspect. An AI will do the investigation, so a guess is fine.
    validations:
      required: false
