name: "Task（実装単位）"
description: "design doc から分解された実装単位、または設計判断のない作業"
title: "[Task] "
labels: ["type/task", "stage/g2-build"]
body:
  - type: markdown
    attributes:
      value: |
        **1 Issue = 1 つの検証可能な成果。** 目安は半日〜2 日（AI セッション 1〜3 回）。
        大きすぎる場合は分割してください（`size/xl` は `agent/ready` を付けられません）。

  - type: input
    id: design-doc
    attributes:
      label: Design doc
      description: DD から分解した Task なら ID を記入。設計判断のない雑務なら「なし」。
      placeholder: "DD-0004"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: やること
      description: 1〜3 文。「〜を実装する」と言い切れる粒度で。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: "**これが AI の完了判定になります。** 検証コマンドを必ず書いてください。"
      value: |
        - **AC-1**: Given <前提>, When <操作>, Then <期待結果>
          - 検証: `<コマンド>`
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 影響範囲
      description: 触るファイル・モジュール。**ここに書かれていない場所は触りません。**
      value: |
        - 触ってよい場所:
        - 触ってはいけない場所:
        - 踏襲するパターン:
    validations:
      required: true

  - type: input
    id: depends
    attributes:
      label: 依存
      description: 先に完了している必要がある Issue。
      placeholder: "Depends on #12"
    validations:
      required: false

  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      description: "**すべて満たしたときだけ** `agent/ready` を付けてください（付けるのは人間です）。"
      options:
        - label: 解く問題が 1 文で書ける
        - label: 受け入れ条件が検証可能な形で書かれている
        - label: 影響範囲が特定されている
        - label: design doc が必要なら `approved` 済みで、ここから参照されている
        - label: 未解決の Decision Point がない
        - label: "`size/xl` ではない"
