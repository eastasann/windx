name: "Task"
description: "A unit decomposed from a design doc, or work with no design judgment"
title: "[Task] "
labels: ["type/task", "stage/g2-build"]
body:
  - type: markdown
    attributes:
      value: |
        **1 Issue = 1 verifiable outcome.** Aim for half a day to two days (1–3 AI sessions).
        Split anything larger — `size/xl` may not carry `agent/ready`.

  - type: input
    id: design-doc
    attributes:
      label: Design doc
      description: The DD this was decomposed from. Write "none" for chores with no design judgment.
      placeholder: "DD-0004"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What to do
      description: One to three sentences, at a granularity where you can say "implement X".
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "**This is how the AI decides it is done.** Always include the verifying command."
      value: |
        - **AC-1**: Given <precondition>, When <action>, Then <expected result>
          - Verify: `<command>`
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Affected surface
      description: Files and modules. **Anything not listed here will not be touched.**
      value: |
        - May touch:
        - Must not touch:
        - Follow this pattern:
    validations:
      required: true

  - type: input
    id: depends
    attributes:
      label: Dependencies
      description: Issues that must finish first.
      placeholder: "Depends on #12"
    validations:
      required: false

  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      description: "Apply `agent/ready` only when **all** of these hold — and a human applies it, never the agent."
      options:
        - label: The problem fits in one sentence
        - label: Acceptance criteria are written verifiably
        - label: The affected surface is identified
        - label: If a design doc is needed, it is `approved` and referenced here
        - label: No unresolved Decision Point
        - label: It is not `size/xl`
