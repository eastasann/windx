name: "Design Doc"
description: "A change that needs design agreement. Becomes the G1 tracking Issue"
title: "[DD] "
labels: ["type/design-doc", "stage/g1-design", "agent/needs-human"]
body:
  - type: markdown
    attributes:
      value: |
        The tracking Issue for writing a design doc (DD).
        **The doc itself goes up as a separate PR, as `docs/design/DD-xxxx-*.md`.**

        How to write it: [`docs/process/03-design-doc.md`](https://github.com/eastasann/windx/blob/main/docs/process/03-design-doc.md)
        Scaffold it: `python3 scripts/new_doc.py design "<title>" --slug <english-slug>`

  - type: textarea
    id: problem
    attributes:
      label: The problem to solve
      description: What is wrong, and who is hurting. Describe the problem, not the solution.
      placeholder: |
        Session validation has a p99 of 400ms, so the screen after login feels slow.
        The current implementation hits the database on every request and exhausts the
        connection pool at peak.
    validations:
      required: true

  - type: textarea
    id: why-doc
    attributes:
      label: Why this needs a design doc
      description: Check everything that applies. If none do, use the Feature or Task template instead.
      value: |
        - [ ] Spans more than one component or service
        - [ ] Changes a public API, a schema, or the shape of persisted data
        - [ ] Expensive to change later (a migration would be needed)
        - [ ] Two or more reasonable alternatives exist and picking one takes judgment
        - [ ] Touches security, privacy, billing, or availability
        - [ ] Estimated over 3 person-days / 3 sessions
    validations:
      required: true

  - type: input
    id: owner
    attributes:
      label: Owner (accountable for this doc)
      description: The person who answers the Decision Points and approves. **Exactly one.**
      placeholder: "@eastasann"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Expected scope / what is out of scope
      description: What you know so far. This becomes the first draft of the doc's Non-Goals.
    validations:
      required: false

  - type: input
    id: doc-link
    attributes:
      label: Design doc
      description: Fill in the ID and PR once the doc exists.
      placeholder: "DD-0004 / PR #12"
    validations:
      required: false
