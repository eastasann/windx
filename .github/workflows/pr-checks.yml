name: pr-checks

# PR 本文のトレーサビリティ（Closes #n / Design doc）を検証する。
# 規約: docs/process/05-issues-roadmap.md
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  traceability:
    name: トレーサビリティ検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PR 本文は外部入力なので、必ず環境変数経由で渡す（コマンドへの直接展開はしない）
      - name: PR 本文を検証
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 scripts/check_pr.py
