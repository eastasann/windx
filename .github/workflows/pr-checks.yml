name: pr-checks

# Validates PR traceability (Closes #n / Design doc).
# Conventions: docs/process/05-issues-roadmap.md
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  traceability:
    name: Traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The PR body is untrusted input, so it is always passed through the environment
      # rather than interpolated into a command line.
      - name: Check the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 scripts/check_pr.py
