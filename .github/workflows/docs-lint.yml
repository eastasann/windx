name: docs-lint

# Validates the structure of design docs, ADRs, links, and label definitions.
# Conventions: docs/process/03-design-doc.md, docs/process/08-adr.md
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Document structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate design docs and ADRs
        run: python3 scripts/validate_docs.py

      - name: Validate label definitions
        run: python3 scripts/sync_labels.py --dry-run

      - name: Check for broken relative links
        run: python3 scripts/check_links.py

      - name: Self-test the Projects sync mapping
        run: python3 scripts/project_sync.py --self-test
