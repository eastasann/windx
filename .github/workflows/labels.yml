name: labels

# Syncs .github/labels.yml to the repository's GitHub labels.
# Conventions: docs/process/05-issues-roadmap.md
on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - "scripts/sync_labels.py"
      - ".github/workflows/labels.yml"
  workflow_dispatch:
    inputs:
      prune:
        description: "Also delete labels that are not in labels.yml"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/sync_labels.py ${{ inputs.prune && '--prune' || '' }}
